<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContractFlow</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142033}header{background:#101c2e;color:#fff;padding:18px 24px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:35px 18px}h1{font-size:38px;margin:0 0 8px}.sub{color:#66758b;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.card{background:#fff;border:1px solid #dde4ed;border-radius:14px;padding:20px;box-shadow:0 3px 15px #1020300a}h2{font-size:16px;margin:0 0 15px}textarea{width:100%;height:330px;border:1px solid #d8e0ea;border-radius:9px;padding:12px;font-size:14px;line-height:1.5}button{border:0;border-radius:8px;padding:12px 15px;font-weight:700;cursor:pointer}.blue{background:#1769ff;color:white}.full{width:100%;margin-top:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:11px;font-weight:700;color:#5f6e82}.f input{width:100%;height:38px;border:1px solid #d8e0ea;border-radius:8px;padding:0 10px;margin-top:5px}.bar{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}.gray{background:#e9eef5;color:#223149}.status{font-size:12px;color:#607086;text-align:right;margin-top:8px}.status.err{color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header>CF &nbsp; ContractFlow</header><div class="wrap"><h1>Deal notes → contract → PDF</h1><div class="sub">Paste the deal info, review the fields, then generate the completed contract.</div><div class="grid"><div class="card"><h2>1. Paste deal info</h2><textarea id="raw"></textarea><button class="blue full" id="parse">Parse deal info →</button></div><div class="card"><h2>2. Review contract fields</h2><div class="fields" id="fields"></div><label style="display:block;margin-top:12px;font-size:13px"><input type="checkbox" id="vacant" checked> Delivered vacant at closing</label></div></div><div class="card" style="margin-top:18px"><h2>3. Generate PDF</h2><div class="bar"><button class="gray" id="aoc">Assignment PDF</button><button class="blue" id="purchase">Purchase Contract PDF</button></div><div class="status" id="status"></div></div></div><script>
const {PDFDocument,StandardFonts,rgb}=PDFLib,$=id=>document.getElementById(id),repo='https://raw.githubusercontent.com/doron333/wholesale-contract/main/templates/';
const today=new Date().toISOString().slice(0,10);
const names=[['sellerName','Seller name'],['sellerEmail','Seller email'],['sellerPhone','Seller phone'],['address','Property address'],['municipality','Municipality'],['county','County'],['purchasePrice','Purchase price'],['emd','EMD'],['inspectionDays','Inspection days'],['agreementDate','Agreement date'],['closingDate','Closing date'],['titleCompany','Title company'],['buyerName','Buyer company'],['buyerSigner','Buyer signer'],['assigneeName','Assignee name'],['assignmentEmd','Assignment EMD'],['assignmentEscrow','Assignment escrow']];
const countyByTown={carteret:'Middlesex',edison:'Middlesex',woodbridge:'Middlesex',newark:'Essex','jersey city':'Hudson',camden:'Camden',trenton:'Mercer',paterson:'Passaic',elizabeth:'Union','toms river':'Ocean','cherry hill':'Camden'};
let d={buyerName:'Guardian Property Investments LLC',buyerSigner:'Jacob Heino',emd:'5000',inspectionDays:'60',agreementDate:today,vacant:true,assigneeName:'',assignmentEmd:'5000',assignmentEscrow:''};
$('fields').innerHTML=names.map(x=>`<div class=f><label>${x[1]}<input id="${x[0]}" ${/Date$/.test(x[0])?'type=date':''}></label></div>`).join('');
function nMoney(s=''){let m=s.toLowerCase().replace(/,/g,'').match(/\$?\s*(\d+(?:\.\d+)?)\s*([km])?/);if(!m)return'';let n=+m[1];if(m[2]=='k')n*=1e3;if(m[2]=='m')n*=1e6;return Math.round(n)+''}
function parse(t){let o={...d},ls=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);let e=t.match(/[\w.+-]+@[\w.-]+\.\w+/);if(e)o.sellerEmail=e[0];let ph=t.match(/(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);if(ph)o.sellerPhone=ph[0];let a=ls.find(x=>/\d+\s+.+\b(NJ|New Jersey)\b/i.test(x)||/\d+\s+.+\d{5}/.test(x));if(a){o.address=a;let c=a.match(/,\s*([^,]+),\s*(?:NJ|New Jersey)/i);if(c){o.municipality=c[1].trim();o.county=countyByTown[o.municipality.toLowerCase()]||o.county||''}}let cm=t.match(/county\s*(?:of|:)?\s*([A-Za-z ]+?)(?:\n|,|$)/i);if(cm)o.county=cm[1].trim();let em=ls.find(x=>/\bemd\b|earnest/i.test(x));if(em)o.emd=nMoney(em);let priceCandidates=ls.filter(x=>x!==a&&!x.includes('@')&&!/\bemd\b|earnest|day|inspection|close|closing|phone|zip/i.test(x));let pr=priceCandidates.find(x=>/purchase\s*price|price|offer/i.test(x)&&/\$?\d/i.test(x))||priceCandidates.find(x=>/(?:\$\s*)?\d[\d,]*(?:\.\d+)?\s*[km]\b/i.test(x))||priceCandidates.find(x=>/\$\s*\d[\d,]*/.test(x));if(pr){let n=nMoney(pr);if(+n>=10000)o.purchasePrice=n}let cl=t.match(/(\d+)\s*day[s]?\s*(?:close|closing)/i)||t.match(/(?:close|closing)\s*(?:in|within)?\s*(\d+)\s*day/i);if(cl){let z=new Date((o.agreementDate||today)+'T12:00:00');z.setDate(z.getDate()+(+cl[1]));o.closingDate=z.toISOString().slice(0,10)}let ins=t.match(/(\d+)\s*day[s]?\s*inspection/i)||t.match(/inspection\s*(?:period)?\s*(?:of|is)?\s*(\d+)\s*day/i);if(ins)o.inspectionDays=ins[1];let nm=ls.find(x=>!x.includes('@')&&!/\d/.test(x)&&!/day|vacant|occupied|emd|inspection|close|closing|price|cash|county/i.test(x)&&x.split(/\s+/).length>1&&x.length<60);if(nm)o.sellerName=nm;o.vacant=/vacant/i.test(t)&&!/not\s+vacant|occupied/i.test(t);return o}
function render(){names.forEach(x=>$(x[0]).value=d[x[0]]||'');$('vacant').checked=!!d.vacant}function read(){names.forEach(x=>d[x[0]]=$(x[0]).value);d.vacant=$('vacant').checked}
async function bytes(name,count){let ss=await Promise.all([...Array(count)].map((_,i)=>fetch(repo+name+'.'+String(i).padStart(2,'0')+'.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Template load failed: '+name);return r.text()})));let b=atob(ss.join('').replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function dl(b,n){let u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function fd(s){return s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):''}function fm(s){return s?(+s).toLocaleString():''}
function whiteTop(page,x,y,w,h){page.drawRectangle({x,y:page.getHeight()-y-h,width:w,height:h,color:rgb(1,1,1)})}function drawTop(page,font,text,x,y,size=9,maxWidth){if(!text)return;let z=size;if(maxWidth)while(z>6.5&&font.widthOfTextAtSize(String(text),z)>maxWidth)z-=.25;page.drawText(String(text),{x,y:page.getHeight()-y-z,size:z,font,color:rgb(0,0,0)})}
$('parse').onclick=()=>{d=parse($('raw').value);render();$('status').className='status';$('status').textContent='Parsed — review the fields.'};
$('purchase').onclick=async()=>{try{read();$('purchase').disabled=true;$('status').className='status';$('status').textContent='Generating...';let p=await PDFDocument.load(await bytes('purchase',11)),f=await p.embedFont(StandardFonts.Helvetica),b=await p.embedFont(StandardFonts.HelveticaBold),pg=p.getPages(),p1=pg[0];whiteTop(p1,64,123,500,53);drawTop(p1,f,`This agreement is made this ${fd(d.agreementDate)}, by and between ${d.sellerName||'________________'}, hereafter called Seller(s), and`,72,129,9.5,468);drawTop(p1,f,`${d.buyerName||'________________'}, hereafter called Buyer(s).`,72,145,9.5,468);whiteTop(p1,178,253,95,21);drawTop(p1,f,d.municipality,184,258,9.5,82);whiteTop(p1,156,279,90,22);drawTop(p1,f,d.county,161,284,9.5,80);whiteTop(p1,291,333,269,23);drawTop(p1,b,d.address,294,338,9.5,255);whiteTop(p1,426,407,90,22);drawTop(p1,f,'$'+fm(d.purchasePrice),431,412,9.5,78);whiteTop(p1,426,443,90,22);drawTop(p1,f,'$'+fm(d.emd),431,448,9.5,78);whiteTop(p1,107,504,90,23);drawTop(p1,f,'$'+fm(Math.max(0,+d.purchasePrice-+d.emd)),112,509,9.5,78);whiteTop(p1,376,591,162,23);drawTop(p1,f,fd(d.closingDate),380,595,9.5,150);whiteTop(p1,158,628,198,23);drawTop(p1,f,d.titleCompany,162,632,9,187);whiteTop(pg[1],289,345,190,31);drawTop(pg[1],f,String(d.inspectionDays||''),293,349,9.5,50);if(d.sellerPhone){whiteTop(pg[3],130,476,155,19);drawTop(pg[3],f,d.sellerPhone,136,479,9,142)}if(d.sellerEmail){whiteTop(pg[3],105,507,180,20);drawTop(pg[3],f,d.sellerEmail,108,511,8.5,170)}if(!d.vacant)whiteTop(pg[3],88,615,250,24);whiteTop(pg[5],91,32,205,34);drawTop(pg[5],b,d.buyerSigner,94,36,10,190);drawTop(pg[5],b,d.buyerName,97,49,10,190);dl(await p.save(),'purchase-contract.pdf');$('status').textContent='Purchase contract downloaded.'}catch(e){$('status').className='status err';$('status').textContent=e.message}finally{$('purchase').disabled=false}};
$('aoc').onclick=async()=>{try{read();$('aoc').disabled=true;$('status').className='status';$('status').textContent='Generating assignment...';let p=await PDFDocument.load(await bytes('aoc',5)),f=await p.embedFont(StandardFonts.Helvetica),b=await p.embedFont(StandardFonts.HelveticaBold),pg=p.getPages()[0];whiteTop(pg,224,82,103,18);drawTop(pg,f,d.buyerName,226,85.5,7.8,98);whiteTop(pg,465,82,92,18);drawTop(pg,f,d.assigneeName||'________________',467,85.5,7.8,86);whiteTop(pg,455,96,106,17);drawTop(pg,f,d.address,457,100.5,7.2,102);whiteTop(pg,320,140,110,18);drawTop(pg,f,fd(d.closingDate),324,143.5,7.8,103);whiteTop(pg,168,195,57,19);drawTop(pg,b,'$'+fm(d.purchasePrice),171,199,8.5,52);whiteTop(pg,89,399,50,19);drawTop(pg,b,'$'+fm(d.assignmentEmd||d.emd),92,403,8.5,46);let esc=d.assignmentEscrow||d.titleCompany;if(esc){whiteTop(pg,43,296,66,18);drawTop(pg,f,esc,46,300,7.2,60);whiteTop(pg,43,317,103,18);drawTop(pg,f,esc,46,321,7.2,97);whiteTop(pg,264,351,84,18);drawTop(pg,f,esc,268,355,7.2,78);whiteTop(pg,297,399,75,18);drawTop(pg,f,esc,301,403,7.2,69)}dl(await p.save(),'assignment-contract.pdf');$('status').textContent='Assignment PDF downloaded.'}catch(e){$('status').className='status err';$('status').textContent=e.message}finally{$('aoc').disabled=false}};
$('raw').value='Alexander Omokha\nAlexanderomokha@yahoo.com\n123 Hagaman St, Carteret, NJ 07008\n470k\n5k EMD\n60 day close\n60 day inspection\nDelivered vacant';d=parse($('raw').value);render();
</script></body></html>
