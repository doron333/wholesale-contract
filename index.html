<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContractFlow</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142033}header{background:#101c2e;color:#fff;padding:18px 24px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:35px 18px}h1{font-size:38px;margin:0 0 8px}.sub{color:#66758b;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.card{background:#fff;border:1px solid #dde4ed;border-radius:14px;padding:20px;box-shadow:0 3px 15px #1020300a}h2{font-size:16px;margin:0 0 15px}textarea{width:100%;height:330px;border:1px solid #d8e0ea;border-radius:9px;padding:12px;font-size:14px;line-height:1.5}button{border:0;border-radius:8px;padding:12px 15px;font-weight:700;cursor:pointer}.blue{background:#1769ff;color:white}.full{width:100%;margin-top:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:11px;font-weight:700;color:#5f6e82}.f input{width:100%;height:38px;border:1px solid #d8e0ea;border-radius:8px;padding:0 10px;margin-top:5px}.bar{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}.gray{background:#e9eef5;color:#223149}.status{font-size:12px;color:#607086;text-align:right;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><header>CF &nbsp; ContractFlow</header><div class="wrap"><h1>Deal notes → contract → PDF</h1><div class="sub">Paste the deal info, review the fields, then generate the completed contract.</div><div class="grid"><div class="card"><h2>1. Paste deal info</h2><textarea id="raw"></textarea><button class="blue full" id="parse">Parse deal info →</button></div><div class="card"><h2>2. Review contract fields</h2><div class="fields" id="fields"></div><label style="display:block;margin-top:12px;font-size:13px"><input type="checkbox" id="vacant" checked> Delivered vacant at closing</label></div></div><div class="card" style="margin-top:18px"><h2>3. Generate PDF</h2><div class="bar"><button class="gray" id="aoc">Assignment PDF</button><button class="blue" id="purchase">Purchase Contract PDF</button></div><div class="status" id="status"></div></div></div><script>
const {PDFDocument,StandardFonts,rgb}=PDFLib,$=id=>document.getElementById(id),repo='https://raw.githubusercontent.com/doron333/wholesale-contract/main/templates/';
const names=[['sellerName','Seller name'],['sellerEmail','Seller email'],['sellerPhone','Seller phone'],['address','Property address'],['municipality','Municipality'],['county','County'],['purchasePrice','Purchase price'],['emd','EMD'],['inspectionDays','Inspection days'],['closingDate','Closing date'],['titleCompany','Title company'],['buyerName','Buyer company'],['buyerSigner','Buyer signer']];
let d={buyerName:'Guardian Property Investments LLC',buyerSigner:'Jacob Heino',emd:'5000',inspectionDays:'60',vacant:true};
$('fields').innerHTML=names.map(x=>`<div class=f><label>${x[1]}<input id="${x[0]}"></label></div>`).join('');
function nMoney(s=''){let m=s.toLowerCase().replace(/,/g,'').match(/\$?\s*(\d+(?:\.\d+)?)\s*([km])?/);if(!m)return'';let n=+m[1];if(m[2]=='k')n*=1e3;if(m[2]=='m')n*=1e6;return Math.round(n)+''}
function parse(t){let o={...d},ls=t.split(/\n+/).map(x=>x.trim()).filter(Boolean);let e=t.match(/[\w.+-]+@[\w.-]+\.\w+/);if(e)o.sellerEmail=e[0];let a=ls.find(x=>/\d+\s+.+\b(NJ|New Jersey)\b/i.test(x)||/\d+\s+.+\d{5}/.test(x));if(a){o.address=a;let c=a.match(/,\s*([^,]+),\s*(?:NJ|New Jersey)/i);if(c)o.municipality=c[1].trim();if(/carteret/i.test(a))o.county='Middlesex'}let em=ls.find(x=>/emd|earnest/i.test(x));if(em)o.emd=nMoney(em);let pr=ls.find(x=>!/emd|earnest/i.test(x)&&/\d+\s*[km]?\b/i.test(x)&&!/day|inspection|close/i.test(x));if(pr)o.purchasePrice=nMoney(pr);let cl=t.match(/(\d+)\s*day[s]?\s*(?:close|closing)/i);if(cl){let z=new Date();z.setDate(z.getDate()+(+cl[1]));o.closingDate=z.toISOString().slice(0,10)}let ins=t.match(/(\d+)\s*day[s]?\s*inspection/i);if(ins)o.inspectionDays=ins[1];let nm=ls.find(x=>!x.includes('@')&&!/\d/.test(x)&&!/day|vacant|emd|close|inspection/i.test(x)&&x.split(/\s+/).length>1);if(nm)o.sellerName=nm;o.vacant=/vacant/i.test(t)&&!/not vacant|occupied/i.test(t);return o}
function render(){names.forEach(x=>$(x[0]).value=d[x[0]]||'');$('vacant').checked=!!d.vacant}function read(){names.forEach(x=>d[x[0]]=$(x[0]).value);d.vacant=$('vacant').checked}
async function bytes(name,count){let ss=await Promise.all([...Array(count)].map((_,i)=>fetch(repo+name+'.'+String(i).padStart(2,'0')+'.b64').then(r=>{if(!r.ok)throw Error('Template load failed');return r.text()})));let b=atob(ss.join('').replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function dl(b,n){let u=URL.createObjectURL(new Blob([b],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function fd(s){return s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):''}function fm(s){return s?(+s).toLocaleString():''}
$('parse').onclick=()=>{d=parse($('raw').value);render();$('status').textContent='Parsed — review the fields.'};
$('purchase').onclick=async()=>{try{read();$('status').textContent='Generating...';let p=await PDFDocument.load(await bytes('purchase',11)),f=await p.embedFont(StandardFonts.Helvetica),pg=p.getPages(),p1=pg[0],h=p1.getHeight(),w=(t,x,y,s=9)=>t&&p1.drawText(String(t),{x,y:h-y-s,size:s,font:f,color:rgb(0,0,0)});w(d.sellerName,260,54);w(d.buyerName,255,77);w(d.municipality,155,124);w(d.county,138,145);w(d.address,175,188);w('$'+fm(d.purchasePrice),455,210);w('$'+fm(d.emd),455,232);w('$'+fm(Math.max(0,+d.purchasePrice-+d.emd)),455,255);w(fd(d.closingDate),250,284);w(d.titleCompany,315,307);pg[1].drawText(String(d.inspectionDays||''),{x:280,y:pg[1].getHeight()-114,size:9,font:f,color:rgb(0,0,0)});if(d.sellerPhone)pg[3].drawText(d.sellerPhone,{x:115,y:pg[3].getHeight()-647,size:8,font:f});if(d.sellerEmail)pg[3].drawText(d.sellerEmail,{x:95,y:pg[3].getHeight()-668,size:8,font:f});pg[5].drawText(d.buyerSigner||'',{x:104,y:pg[5].getHeight()-62,size:9,font:f});pg[5].drawText(d.buyerName||'',{x:104,y:pg[5].getHeight()-83,size:9,font:f});dl(await p.save(),'purchase-contract.pdf');$('status').textContent='Purchase contract downloaded.'}catch(e){$('status').textContent=e.message}};
$('aoc').onclick=async()=>{read();let p=await PDFDocument.create(),pg=p.addPage([612,792]),f=await p.embedFont(StandardFonts.Helvetica),b=await p.embedFont(StandardFonts.HelveticaBold),y=740,tx=(t,s=10,bo=false)=>{pg.drawText(t,{x:52,y,size:s,font:bo?b:f,color:rgb(0,0,0),maxWidth:508});y-=s+10};tx('ASSIGNMENT OF RESIDENTIAL/COMMERCIAL PURCHASE CONTRACT',14,true);y-=12;tx(`Assignor: ${d.buyerName||''}`);tx('Assignee: ______________________________');tx(`Property: ${d.address||''}`);tx(`Closing: ${fd(d.closingDate)}`);y-=8;tx('For good and valuable consideration, Assignor assigns to Assignee all rights, interest, claims and title to the purchase contract concerning the Subject Property. Assignee accepts all obligations and responsibilities under the Purchase Contract and agrees to close on or before the closing date.',10);y-=20;tx(`Purchase Contract Price: $${fm(d.purchasePrice)}`);tx('Assignment Fee: $________________');tx('Assignment EMD: $________________');y-=30;tx('Assignee Signature: ______________________________    Date: __________');tx('Assignor Signature: ______________________________    Date: __________');dl(await p.save(),'assignment-contract.pdf');$('status').textContent='Assignment PDF downloaded.'};
$('raw').value='Alexander Omokha\nAlexanderomokha@yahoo.com\n123 Hagaman St, Carteret, NJ 07008\n470k\n5k EMD\n60 day close\n60 day inspection\nDelivered vacant';d=parse($('raw').value);render();
</script></body></html>
